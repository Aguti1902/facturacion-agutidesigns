<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>agutidesigns Gestión</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral con módulos + área de trabajo; en móvil, barra superior desplazable */
:root{
  --ink:#14161B; --acc:#2F5BFF; --acc-ink:#FFFFFF;
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#ECEEF2; --line:#DFE2E8;
  --fg:#14161B; --muted:#5E6472; --accent:#2F5BFF; --accent-soft:#E6ECFF;
  --ok:#237A4B; --ok-soft:#E2F3E9; --warn:#9A5B06; --warn-soft:#FBEFD9; --bad:#B42F24; --bad-soft:#F9E3E0;
  --side:#14161B; --side-fg:#ECEEF3; --side-muted:#8B92A1;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#171A20; --surface-2:#1F232B; --line:#2B3039;
  --fg:#ECEEF3; --muted:#9AA1AF; --accent:#8FA6FF; --accent-soft:#1C2542;
  --ok:#78C99A; --ok-soft:#172B20; --warn:#E6B065; --warn-soft:#33281A; --bad:#EF8F85; --bad-soft:#3A1F1C;
  --side:#090A0D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A20; --surface-2:#1F232B; --line:#2B3039;
  --fg:#ECEEF3; --muted:#9AA1AF; --accent:#8FA6FF; --accent-soft:#1C2542;
  --ok:#78C99A; --ok-soft:#172B20; --warn:#E6B065; --warn-soft:#33281A; --bad:#EF8F85; --bad-soft:#3A1F1C;
  --side:#090A0D; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
aside{background:var(--side);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{padding:4px 10px;display:flex;align-items:center;gap:10px;min-height:34px}
.brand img{max-height:30px;max-width:170px;width:auto}
.brand .wm{font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand .wm span{color:var(--acc)}
nav{display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:12px 12px 4px;font-weight:700}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--side-muted);font-weight:600;font-size:13.5px}
nav button:hover{color:var(--side-fg);background:rgba(255,255,255,.06)}
nav button[aria-current="page"]{color:var(--acc-ink);background:var(--acc)}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav button:disabled{opacity:.35;pointer-events:none}
nav svg{width:17px;height:17px;flex:none}
nav .badge{margin-left:auto;background:var(--warn);color:#fff;font-size:10.5px;border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);line-height:1.5}
.linkbtn{all:unset;cursor:pointer;color:var(--side-fg);text-decoration:underline}
main{padding-block:28px 60px;padding-inline:clamp(16px,3.5vw,44px);min-width:0;max-width:1220px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
h2{font-size:15px;font-weight:700;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:13px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}
.qbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qbar button{font:inherit;font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.qbar button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qbar select{font:inherit;font-weight:700;font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--f-num);font-size:21px;font-weight:600;letter-spacing:-.01em}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--ink);border-color:var(--ink);color:#fff}
.kpi.hl .lab,.kpi.hl .hint{color:#B9C6FF}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.pad{padding:14px 18px}
.lines .l{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);gap:12px}
.lines .l:last-child{border-bottom:0}
.lines .l.t{font-weight:800;font-size:15px}
.box{font-family:var(--f-num);font-size:11px;color:var(--muted);margin-right:6px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--accent-soft);color:var(--fg)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert b{font-weight:700}
.alert .btn{margin-left:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
td .s{display:block;font-size:12px;color:var(--muted)}
tfoot td{font-weight:800;background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mut{background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,11,14,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(900px,100%);height:100%;overflow:auto;padding-block:calc(22px + env(safe-area-inset-top,0px)) 40px;padding-inline:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:16px}
.drawer .head{margin:0}
fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 4;min-width:0}
.f.w2{grid-column:span 2}.f.w3{grid-column:span 3}.f.w5{grid-column:span 5}.f.w6{grid-column:span 6}.f.w8{grid-column:span 8}.f.w12{grid-column:span 12}
label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg)}
.chk input{width:auto}
input,select,textarea{font:inherit;font-size:14px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
input.num{text-align:right}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,3fr) 90px 64px 64px 78px 36px;gap:8px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.item .c{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .c input:last-child{font-size:12.5px;padding:6px 10px}
.ih{display:grid;grid-template-columns:minmax(0,3fr) 90px 64px 64px 78px 36px;gap:8px;padding:0 10px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.totals{margin-left:auto;width:min(340px,100%);display:flex;flex-direction:column;gap:2px}
.totals div{display:flex;justify-content:space-between;padding:6px 2px}
.totals .t{background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:10px 12px;font-weight:800;font-size:16px;margin-top:4px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface);display:block}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.tip{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.login{max-width:460px;margin:8vh auto 0;padding:24px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.deadline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.deadline:last-child{border-bottom:0}
.swatch{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);padding:0}
@media (max-width:1020px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;z-index:10;overflow-x:auto}
  .brand{padding:0}.brand .wm{font-size:15px}
  nav{flex-direction:row}
  nav .grp{display:none}
  nav button{padding:7px 10px;font-size:12.5px}
  nav button span{display:none}
  nav button[aria-current="page"] span{display:inline}
  .side-foot{display:none}
  .f,.f.w2,.f.w3,.f.w5,.f.w6,.f.w8{grid-column:span 12}
  .item{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px 36px}
  .item .c{grid-column:1/-1}
  .ih{display:none}
  .kpi .val{font-size:17px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand" id="brand"><span class="wm">agutidesigns<span>.</span></span></div>
    <nav id="nav">
      <button data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
      <div class="grp">Negocio</div>
      <button data-v="ventas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h5"/></svg><span>Ventas</span></button>
      <button data-v="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Gastos</span><b class="badge" id="badge-gastos" hidden></b></button>
      <button data-v="tesoreria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg><span>Tesorería</span></button>
      <button data-v="impuestos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6h6v6M9 11h6"/></svg><span>Impuestos</span></button>
      <div class="grp">Datos</div>
      <button data-v="contactos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg><span>Contactos</span></button>
      <button data-v="productos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg><span>Productos</span></button>
      <button data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Ajustes</span></button>
    </nav>
    <div class="side-foot" id="acct" hidden><span id="who"></span><br><button class="linkbtn" id="logout">Salir</button></div>
  </aside>
  <main id="main"><div class="empty"><b>Cargando…</b>Comprobando tu sesión.</div></main>
</div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const eur=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:2,useGrouping:"always"}).format(r2(n));
const eurP=n=>{const neg=r2(n)<0;const s=Math.abs(r2(n)).toFixed(2).split(".");return (neg?"-":"")+s[0].replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+s[1]+" €";};
const fdate=d=>d?d.slice(0,10).split("-").reverse().join("/"):"";
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const addMonths=(d,n)=>{const x=new Date(d+"T12:00:00");const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x.toISOString().slice(0,10);};
const qOf=d=>{const [y,m]=d.split("-").map(Number);return {y,q:Math.floor((m-1)/3)+1};};
const inQ=(d,y,q)=>{if(!d)return false;const o=qOf(d);return o.y===y&&o.q===q;};
const qEnd=(y,q)=>q===4?`${y}-12-31`:`${y}-${String(q*3).padStart(2,"0")}-${q===1?"31":"30"}`;
const inYTD=(d,y,q)=>!!d&&d.slice(0,4)===String(y)&&d<=qEnd(y,q);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const safe=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_").replace(/^_|_$/g,"");
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
function errMsg(e){const c=e&&e.code;if(c==="invalid_argument")return "No tienes permiso para guardar, o un dato no es válido.";return "No se pudo guardar. Inténtalo de nuevo.";}
const CATS=["Software y suscripciones","Servidores y hosting","Publicidad","Material y equipos","Servicios profesionales","Subcontratación","Formación","Viajes y dietas","Vehículo y transporte","Teléfono e internet","Oficina y suministros","Cuota de autónomos","Seguros","Comisiones bancarias","Otros"];
const REGION={ES:"España",UE:"Unión Europea",EXT:"Fuera de la UE"};
const MONTHS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

/* ---------- estado ---------- */
const S={view:"inicio",tab:{ventas:"facturas",contactos:"clientes"},y:null,q:null,email:null,db:null,
  settings:null,contacts:[],products:[],invoices:[],quotes:[],recurring:[],expenses:[],loaded:{}};
{const n=new Date();S.y=n.getFullYear();S.q=Math.floor(n.getMonth()/3)+1;}
try{const v=localStorage.getItem("au_view");if(v)S.view=v;}catch(e){}
const COLS=["settings","contacts","products","invoices","quotes","recurring","expenses"];

/* ---------- cálculos ---------- */
function lineBase(it){return r2((+it.price||0)*(+it.qty||0)*(1-(+it.dto||0)/100));}
function docTotals(d){let base=0,iva=0;const byRate={};for(const it of d.items||[]){const b=lineBase(it);const v=r2(b*(+it.vat||0)/100);base+=b;iva+=v;const k=+it.vat||0;byRate[k]=byRate[k]||{base:0,iva:0};byRate[k].base+=b;byRate[k].iva+=v;}
  base=r2(base);iva=r2(iva);const irpf=+d.irpf?r2(base*(+d.irpf)/100):0;return {base,iva,irpf,total:r2(base+iva-irpf),byRate};}
function invStatus(inv){if(inv.status==="pagada")return ["Cobrada","ok"];if(inv.kind==="rectificativa"&&inv.status!=="anulada")return ["Abono","acc"];if(inv.status==="anulada")return ["Anulada","mut"];if(inv.status==="rectificada")return ["Rectificada","mut"];if(inv.due&&inv.due<today())return ["Vencida","bad"];return ["Pendiente","warn"];}
function quoteStatus(q){return {aceptado:["Aceptado","ok"],rechazado:["Rechazado","mut"],facturado:["Facturado","acc"]}[q.status]||(q.validUntil&&q.validUntil<today()?["Caducado","bad"]:["Enviado","warn"]);}
const counts=inv=>inv.status!=="anulada";
const receivable=i=>counts(i)&&i.status!=="pagada"&&i.status!=="rectificada"&&i.kind!=="rectificativa"&&docTotals(i).total>0;
function expVat(e){if(e.reverseCharge)return 0;return e.vatAmount!=null&&e.vatAmount!==""?r2(e.vatAmount):r2((+e.base||0)*(+e.vat||0)/100);}
function expIrpf(e){return e.irpfAmount!=null&&e.irpfAmount!==""?r2(e.irpfAmount):r2((+e.base||0)*(+e.irpf||0)/100);}
function expTotal(e){return r2((+e.base||0)+expVat(e)-expIrpf(e));}
const dedPct=e=>e.deductiblePct==null?100:+e.deductiblePct;
function ispRate(e){return 21;}

function quarterData(y,q){
  const inv=S.invoices.filter(i=>counts(i)&&inQ(i.date,y,q));
  const exp=S.expenses.filter(e=>inQ(e.date,y,q));
  const I={base:0,iva:0,irpf:0,total:0},E={base:0,iva:0,total:0,sinPdf:0,review:0};
  inv.forEach(i=>{const t=docTotals(i);I.base+=t.base;I.iva+=t.iva;I.irpf+=t.irpf;I.total+=t.total;});
  exp.forEach(e=>{E.base+=+e.base||0;E.iva+=expVat(e)*dedPct(e)/100;E.total+=expTotal(e);if(!e.assetId)E.sinPdf++;if(e.needsReview)E.review++;});
  for(const o of [I,E])for(const k in o)o[k]=r2(o[k]);
  return {inv,exp,I,E};
}
/* Modelo 303 */
function m303(y,q){const {inv,exp}=quarterData(y,q);const dev={};let devT=0;
  inv.forEach(i=>{const t=docTotals(i);for(const k in t.byRate){if(+k===0)continue;dev[k]=dev[k]||{base:0,cuota:0};dev[k].base+=t.byRate[k].base;dev[k].cuota+=t.byRate[k].iva;}});
  for(const k in dev){dev[k].base=r2(dev[k].base);dev[k].cuota=r2(dev[k].cuota);devT+=dev[k].cuota;}
  const ue={base:0,cuota:0},ext={base:0,cuota:0};let ded=0;
  exp.forEach(e=>{if(e.reverseCharge){const o=e.region==="UE"?ue:ext;const b=+e.base||0;o.base+=b;o.cuota+=b*ispRate(e)/100;}else if(e.deductible!==false){ded+=expVat(e)*dedPct(e)/100;}});
  ue.base=r2(ue.base);ue.cuota=r2(ue.cuota);ext.base=r2(ext.base);ext.cuota=r2(ext.cuota);
  const exentas=r2(inv.reduce((a,i)=>{const t=docTotals(i);return a+(t.byRate[0]?t.byRate[0].base:0);},0));
  const devTotal=r2(devT+ue.cuota+ext.cuota);const dedTotal=r2(ded+ue.cuota+ext.cuota);
  return {dev,ue,ext,ded:r2(ded),exentas,devTotal,dedTotal,result:r2(devTotal-dedTotal)};}
/* Modelo 130 (estimación directa simplificada) */
function m130(y,q){const inv=S.invoices.filter(i=>counts(i)&&inYTD(i.date,y,q));const exp=S.expenses.filter(e=>inYTD(e.date,y,q));
  const ingresos=r2(inv.reduce((a,i)=>a+docTotals(i).base,0));
  const gastos=r2(exp.reduce((a,e)=>{let g=(+e.base||0)*dedPct(e)/100;if(e.deductible===false&&!e.reverseCharge)g+=expVat(e);return a+g;},0));
  const cuotaSS=0;const prev=r2(ingresos-gastos);
  const dj=(S.settings?.dificilJustificacion!==false)&&prev>0?r2(Math.min(prev*0.05,2000)):0;
  const rend=r2(prev-dj);const c04=rend>0?r2(rend*0.20):0;
  const ret=r2(inv.reduce((a,i)=>a+docTotals(i).irpf,0));
  let pagos=0;for(let k=1;k<q;k++){pagos+=Math.max(0,m130(y,k).result);}pagos=r2(pagos);
  return {ingresos,gastos,dj,rend,c04,pagos,ret,result:r2(c04-pagos-ret)};}
/* Modelo 111 */
function m111(y,q){const exp=S.expenses.filter(e=>inQ(e.date,y,q)&&expIrpf(e)>0);const perc=new Set(exp.map(e=>e.cif||e.supplier));return {n:perc.size,base:r2(exp.reduce((a,e)=>a+(+e.base||0),0)),ret:r2(exp.reduce((a,e)=>a+expIrpf(e),0)),exp};}
/* Modelo 349 */
function m349(y,q){const rows=[];S.expenses.filter(e=>inQ(e.date,y,q)&&e.reverseCharge&&e.region==="UE").forEach(e=>rows.push({clave:"I",nif:e.cif,name:e.supplier,base:+e.base||0}));
  S.invoices.filter(i=>counts(i)&&inQ(i.date,y,q)&&i.contact?.region==="UE").forEach(i=>rows.push({clave:"S",nif:i.contact?.cif,name:i.contact?.name,base:docTotals(i).base}));
  const g={};rows.forEach(r=>{const k=r.clave+"|"+(r.nif||r.name);g[k]=g[k]||{...r,base:0};g[k].base+=r.base;});return Object.values(g).map(r=>({...r,base:r2(r.base)}));}
function deadlines(){const y=new Date().getFullYear();const out=[];
  [[y,1,`${y}-04-20`],[y,2,`${y}-07-20`],[y,3,`${y}-10-20`],[y-1,4,`${y}-01-30`],[y,4,`${y+1}-01-30`]].forEach(([yy,q,d])=>out.push({date:d,label:`303 y 130 del T${q} ${yy}`+(m111(yy,q).ret>0?" · 111":"")+(m349(yy,q).length?" · 349":"")}));
  out.push({date:`${y}-01-30`,label:`390 · resumen anual de IVA ${y-1}`});out.push({date:`${y}-06-30`,label:`Renta (modelo 100) ${y-1}`});
  return out.filter(d=>d.date>=addDays(today(),-3)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);}
function nextNumber(kind){const s=S.settings||{};const y2=String(S.y).slice(2);const pref=kind==="quote"?(s.seriesP||"P"+y2+"-"):kind==="rect"?(s.seriesR||"R"+y2+"-"):(s.seriesF||"F"+y2+"-");

async function generateRecurring(){const due=recurringDue();let n=0;
  for(const r of due){let next=r.nextDate;while(next<=today()){const num=nextNumber("invoice");const inv={id:uid(),number:num,kind:"factura",date:next,due:addDays(next,+r.dueDays||15),contactId:r.contactId,contact:r.contact,items:JSON.parse(JSON.stringify(r.items||[])),irpf:r.irpf||0,status:"pendiente",notes:r.notes||"",fromRecurring:r.id,createdAt:new Date().toISOString()};
      try{await save("invoices",inv);S.invoices.push(inv);n++;}catch(e){toast(errMsg(e));return;}
      next=addMonths(next,r.frequency==="anual"?12:r.frequency==="trimestral"?3:1);}
    await save("recurring",{...r,nextDate:next,lastRun:today()});}
  toast(`${n} factura${n!==1?"s":""} emitida${n!==1?"s":""}`);}

   </fieldset></div>
   <div class="panel pad" style="display:flex;flex-direction:column;gap:10px"><h2>Factura del proveedor</h2>
    <label class="drop" id="drop" for="e_file"><input type="file" id="e_file" accept="application/pdf,image/*" hidden>${file?`<b>${esc(file.name)}</b> · se subirá al guardar`:d.assetId?`<b>${esc(d.assetName||"Factura adjunta")}</b> · pulsa para sustituirla`:`<b>Arrastra el PDF aquí</b> o pulsa para elegirlo`}</label>
    ${d.assetId?`<div><button class="btn sm" id="e_open" type="button">Abrir la factura ↗</button></div>`:""}</div>

  const read=()=>{const v=id=>$("#"+id).value;d.date=v("e_date");d.supplier=v("e_sup").trim();d.cif=v("e_cif").trim();d.number=v("e_num").trim();d.concept=v("e_con").trim();d.category=v("e_cat");d.region=v("e_reg");

  const recalc=auto=>{read();if(auto&&!d.reverseCharge){d.vatAmount=null;$("#e_va").value=r2((+d.base||0)*(+d.vat||0)/100);read();}$("#e_tot").value=eur(expTotal(d));};
  const bind=()=>{$("#x").onclick=closeLayer;$(".drawer-bg",L).addEventListener("click",e=>{if(e.target.classList.contains("drawer-bg"))closeLayer();});
   ["#e_base","#e_vat"].forEach(s=>$(s).addEventListener("input",()=>recalc(true)));$("#e_va").addEventListener("input",()=>recalc(false));$("#e_irpf").addEventListener("change",()=>recalc(false));

     catch(e){toast(e&&e.message&&/size|large/i.test(e.message)?"El archivo supera 20 MB.":errMsg(e));b.disabled=false;b.textContent="Guardar";}};

/* ---------- Importar del correo ---------- */
function sameMail(e,m){if(!e.mailAddr||!e.mailSubject)return false;if(e.mailAddr!==m.addr||e.mailSubject.trim()!==(m.subject||"").trim())return false;const a=new Date((e.mailDate||e.date)+(e.mailDate?"":"T12:00:00")),b=new Date(m.date);return Math.abs(a-b)<36*3600*1000;}
function openImport(){const L=$("#layer");const st={y:S.y,q:S.q,list:null,verdict:{},sel:new Set(),busy:false,checking:false,done:0,log:[],err:"",showBad:false};
  const state=m=>{const ex=S.expenses.find(e=>e.id===m.id)||S.expenses.find(e=>sameMail(e,m));if(!ex)return "new";return ex.assetId?"done":"complete";};
  const range=()=>{const m0=(st.q-1)*3+1;const a=`${st.y}-${String(m0).padStart(2,"0")}-01`;const b=st.q===4?`${st.y+1}-01-01`:`${st.y}-${String(m0+3).padStart(2,"0")}-01`;return [a,b];};
  const good=()=>(st.list||[]).filter(m=>st.verdict[m.id]?.ok);const bad=()=>(st.list||[]).filter(m=>st.verdict[m.id]&&!st.verdict[m.id].ok);
  const fileLabel=m=>{const v=st.verdict[m.id]||{};if(v.files&&v.files.length)return v.files.map(f=>`<span class="pill mut" title="PDF adjunto">PDF · ${esc(f.length>28?f.slice(0,26)+"…":f)}</span>`).join(" ");if(v.links&&v.links.length)return `<span class="pill acc" title="${esc(v.links[0].url)}">Enlace: ${esc((v.links[0].text||"descargar").slice(0,24))}</span>`;return "";};
  const row=(m,ok)=>{const s=state(m);const lg=st.log.find(x=>x.id===m.id);const v=st.verdict[m.id]||{};
    return `<tr><td style="width:30px">${ok?`<input type="checkbox" data-m="${esc(m.id)}" aria-label="Seleccionar" ${st.sel.has(m.id)?"checked":""} ${s==="done"||st.busy?"disabled":""} style="width:auto">`:""}</td>
     <td class="num small">${fdate(m.date)}</td><td><b>${esc(m.subject||"(sin asunto)")}</b><span class="s">${esc(m.sender)}${v.total?" · "+eur(v.total):""}</span></td>
     <td style="min-width:170px">${ok?fileLabel(m):`<span class="small muted">${esc(v.reason||"")}</span>`}</td>
     <td class="r" style="white-space:nowrap">${lg?`<span class="pill ${lg.cls}">${esc(lg.msg)}</span>`:ok?(s==="done"?`<span class="pill ok">Ya importada</span>`:s==="complete"?`<span class="pill acc">Añadir PDF</span>`:""):""}</td></tr>`;};
  const draw=()=>{const g=good(),b=bad();const total=(st.list||[]).length;
   L.innerHTML=`<div class="drawer-bg"><div class="drawer" role="dialog" aria-label="Importar facturas del correo">
   <div class="head"><div><h1>Importar facturas del correo</h1><p class="sub">Reviso uno a uno los correos de ${esc(S.mailbox||"tu buzón")} y solo te muestro las facturas de gastos.</p></div><div class="row"><button class="btn ghost" id="x">Cerrar</button></div></div>
   <div class="panel pad" style="display:flex;flex-direction:column;gap:12px"><fieldset>
     <div class="f w3"><label for="m_q">Trimestre</label><select id="m_q">${[1,2,3,4].map(q=>`<option value="${q}" ${st.q===q?"selected":""}>T${q}</option>`).join("")}</select></div>
     <div class="f w3"><label for="m_y">Año</label><input id="m_y" class="num" type="number" value="${st.y}"></div></fieldset>
    <div class="row"><button class="btn primary" id="go" ${st.busy||st.checking?"disabled":""}>${st.list?"Buscar de nuevo":"Buscar facturas"}</button>${st.checking?`<span class="small muted">Revisando correo ${st.done} de ${total}…</span>`:st.list?`<span class="small muted">${total} correos revisados · ${g.length} con factura de gasto · ${b.length} descartados</span>`:""}</div>
    ${st.err?`<div class="alert warn"><div>${esc(st.err)}</div></div>`:""}</div>
   ${st.list?`<div class="panel"><div class="card-h"><h2>${g.length} factura${g.length!==1?"s":""} de gasto</h2><div class="row"><button class="btn ghost" id="all">Marcar todas</button><button class="btn primary" id="imp" ${st.busy||st.checking||!st.sel.size?"disabled":""}>Importar ${st.sel.size||""}</button></div></div>
     ${g.length?`<div class="tw"><table><tbody>${g.map(m=>row(m,true)).join("")}</tbody></table></div>`:`<div class="empty"><b>${st.checking?"Buscando facturas…":"No hay facturas de gasto en ese trimestre"}</b>${st.checking?"Van apareciendo aquí según las encuentro.":""}</div>`}</div>
    ${b.length?`<div class="panel"><div class="card-h"><h2>${b.length} correo${b.length!==1?"s":""} descartado${b.length!==1?"s":""}</h2><button class="btn ghost" id="tog">${st.showBad?"Ocultar":"Ver por qué"}</button></div>${st.showBad?`<div class="tw"><table><tbody>${b.map(m=>row(m,false)).join("")}</tbody></table></div>`:""}</div>`:""}`:""}
   <div class="tip">Descarto las facturas que emites tú, presupuestos, contratos, avisos de pago y correos que solo mencionan una factura. De cada factura se guarda el PDF (adjunto o descargado desde su enlace) y se leen los importes; revisa siempre los marcados como «Revisar».</div></div></div>`;bind();};
  const bind=()=>{$("#x").onclick=()=>{st.cancel=true;closeLayer();};$("#m_q").onchange=e=>{st.q=+e.target.value;draw();};$("#m_y").onchange=e=>{st.y=+e.target.value||st.y;draw();};$("#go").onclick=search;
   $$("[data-m]",L).forEach(cb=>cb.onchange=()=>{cb.checked?st.sel.add(cb.dataset.m):st.sel.delete(cb.dataset.m);draw();});
   const a=$("#all");if(a)a.onclick=()=>{good().forEach(m=>{if(state(m)!=="done")st.sel.add(m.id);});draw();};const i=$("#imp");if(i)i.onclick=run;const t=$("#tog");if(t)t.onclick=()=>{st.showBad=!st.showBad;draw();};};
  async function search(){st.busy=true;st.err="";st.list=null;st.verdict={};st.sel.clear();st.done=0;draw();const [a,b]=range();
    try{const r=await api(`/api/mail/search?from=${a}&to=${b}`);st.list=r.items;if(r.warnings&&r.warnings.length)st.err=r.warnings.join(" ");}
    catch(e){st.err=e.code==="imap_not_configured"?"Falta conectar el correo en Vercel (IMAP_PASSWORD).":e.message;st.busy=false;draw();return;}
    st.busy=false;st.checking=true;draw();
    const groups={};st.list.forEach(m=>{(groups[m.acct||0]=groups[m.acct||0]||[]).push(m);});
    for(const acct in groups){const arr=groups[acct];for(let k=0;k<arr.length;k+=6){if(st.cancel)return;const batch=arr.slice(k,k+6);
      try{const r=await api("/api/mail/classify",{method:"POST",body:JSON.stringify({items:batch.map(m=>({id:m.id,folder:m.folder,uid:m.uid,acct:m.acct||0,parts:m.parts||[],subject:m.subject,addr:m.addr}))})});
        Object.assign(st.verdict,r.results);batch.forEach(m=>{if(r.results[m.id]?.ok&&state(m)!=="done")st.sel.add(m.id);});}
      catch(e){batch.forEach(m=>st.verdict[m.id]={ok:false,reason:"No se pudo revisar: "+(e.message||"error")});}
      st.done=Math.min(st.list.length,st.done+batch.length);draw();}}
    st.checking=false;draw();}
  async function run(){st.busy=true;const ids=[...st.sel];st.log=[];draw();let ok=0,fail=0,skip=0;
    for(const id of ids){const m=st.list.find(x=>x.id===id);const v=st.verdict[id]||{};const ex=S.expenses.find(e=>e.id===m.id)||S.expenses.find(e=>sameMail(e,m));const setLog=(msg,cls)=>{st.log=st.log.filter(x=>x.id!==id).concat([{id,msg,cls}]);draw();};setLog("Descargando…","mut");
     try{const r=await api("/api/mail/import",{method:"POST",body:JSON.stringify({id,folder:m.folder,uid:m.uid,acct:m.acct||0,existingId:ex?ex.id:null,files:v.files||[]})});
      if(r.status==="skipped"){skip++;setLog("No es una factura","mut");}
      else if(r.status==="duplicate"){setLog("Ya importada","ok");}
      else if(r.status==="nofile"){fail++;const l=(r.links||[])[0];setLog(l?("No se pudo descargar: "+l.reason):"Sin PDF descargable","bad");}
      else if(r.gated){ok++;st.sel.delete(id);setLog("Registrada · descarga el PDF (pide iniciar sesión)","warn");}
      else{const n=(r.files||[]).length;ok+=n;st.sel.delete(id);const fromLink=(r.files||[]).some(f=>f.from==="enlace");setLog(n===1?(r.files[0].completed?"PDF añadido al gasto":fromLink?"Factura descargada del enlace":"Factura guardada"):n+" facturas guardadas","ok");}}
     catch(e){fail++;setLog((e.message||"Error").slice(0,60),"bad");}}
    st.busy=false;draw();toast(`${ok} factura${ok!==1?"s":""} guardada${ok!==1?"s":""}${skip?` · ${skip} descartada${skip!==1?"s":""}`:""}${fail?` · ${fail} sin descargar`:""}`);}
  draw();}

 bind(m){$("#new",m).onclick=()=>openContact(null);$$("[data-c]",m).forEach(r=>r.onclick=()=>openContact(S.contacts.find(c=>c.id===r.dataset.c)));}};

  col(DARK);font("bold",type==="quote"?24:d.kind==="rectificativa"?18:26);doc.text(title,R,y+22,{align:"right"});font("normal",10);col(GREY);doc.text("Nº "+(d.number||""),R,y+40,{align:"right"});
  y=128;const bw=(R-L-20)/3;

  meta.forEach(([k,v],i)=>{const x=L+i*(bw+10);fill(i===2?DARK:SOFT);doc.roundedRect(x,y,bw,44,6,6,"F");col(i===2?[255,255,255]:GREY);font("bold",7);doc.text(k,x+12,y+16);font("bold",12);col(i===2?[255,255,255]:DARK);doc.text(v,x+12,y+34);});
  y=200;const block=(x,ttl,lines)=>{fill(ACC);doc.rect(x,y-9,3,12,"F");col(GREY);font("bold",7.5);doc.text(ttl,x+9,y);lines.filter(Boolean).forEach((l,i)=>{col(DARK);font(i===0?"bold":"normal",i?9:10);doc.text(String(l),x,y+20+i*13);});};

  const c=d.contact||{};block(W/2+20,"CLIENTE",[c.name,c.cif?(c.region==="ES"?"NIF: ":"VAT: ")+c.cif:"",c.address,c.city,c.region!=="ES"?c.country:""]);
  y=310;if(d.rectifies){col(GREY);font("normal",8.5);doc.text(`Rectifica la factura ${d.rectifies}`,L,y-14);}
  const cx={p:300,u:336,d:372,s:438,v:470};
  fill(DARK);doc.roundedRect(L,y,R-L,26,5,5,"F");col([255,255,255]);font("bold",7.5);const hy=y+17;
  doc.text("CONCEPTO",L+12,hy);doc.text("PRECIO",cx.p,hy,{align:"right"});doc.text("UDS.",cx.u,hy,{align:"right"});doc.text("DTO.",cx.d,hy,{align:"right"});doc.text("SUBTOTAL",cx.s,hy,{align:"right"});doc.text("IVA",cx.v,hy,{align:"right"});doc.text("TOTAL",R-12,hy,{align:"right"});
  y+=44;(d.items||[]).forEach((it,i)=>{const b=lineBase(it);const cl=doc.splitTextToSize(String(it.concept||""),250);const nl=it.note?doc.splitTextToSize(String(it.note),250):[];const h=12+cl.length*12+nl.length*11;
    if(y+h>H-190){doc.addPage();y=60;}
    if(i%2===1){fill([247,248,250]);doc.rect(L,y-14,R-L,h+4,"F");}
    col(DARK);font("bold",9.5);doc.text(cl,L+12,y);if(nl.length){col(GREY);font("normal",8);doc.text(nl,L+12,y+cl.length*12);}
    col(DARK);font("normal",9);doc.text(eurP(it.price),cx.p,y,{align:"right"});doc.text(String(it.qty),cx.u,y,{align:"right"});doc.text(+it.dto?it.dto+"%":"—",cx.d,y,{align:"right"});doc.text(eurP(b),cx.s,y,{align:"right"});doc.text((+it.vat)+"%",cx.v,y,{align:"right"});font("bold",9);doc.text(eurP(r2(b*(1+(+it.vat)/100))),R-12,y,{align:"right"});y+=h;});
  doc.setDrawColor(223,226,232);doc.line(L,y-6,R,y-6);
  y+=14;const TX=W/2+30;const rows=[["Base imponible",t.base]];Object.keys(t.byRate).filter(k=>+k>0).forEach(k=>rows.push([`IVA ${k} %`,t.byRate[k].iva]));if(t.irpf)rows.push([`Retención IRPF ${d.irpf} %`,-t.irpf]);
  rows.forEach(([k,v])=>{col(GREY);font("normal",9.5);doc.text(k,TX+12,y);col(DARK);font("bold",9.5);doc.text(eurP(v),R-12,y,{align:"right"});y+=18;});
  y+=4;fill(ACC);doc.roundedRect(TX,y,R-TX,34,6,6,"F");col([255,255,255]);font("bold",11);doc.text("TOTAL",TX+12,y+21);font("bold",15);doc.text(eurP(t.total),R-12,y+22,{align:"right"});y+=58;
  const legal=[];if(c.region==="UE"&&(d.items||[]).every(i=>+i.vat===0))legal.push("Operación con inversión del sujeto pasivo (art. 84.Uno.2º y 69.Uno LIVA; art. 196 Directiva 2006/112/CE).");
  if(c.region==="EXT"&&(d.items||[]).every(i=>+i.vat===0))legal.push("Operación no sujeta a IVA por reglas de localización (art. 69 LIVA).");
  if(d.notes)legal.unshift(d.notes);
  legal.forEach(tx=>{const ls=doc.splitTextToSize(tx,R-L);col(GREY);font("normal",8.5);doc.text(ls,L,y);y+=ls.length*11+6;});
  if(type!=="quote"&&s.iban){y+=6;fill(SOFT);doc.roundedRect(L,y,R-L,54,6,6,"F");fill(ACC);doc.rect(L,y,4,54,"F");col(DARK);font("bold",9.5);doc.text("Forma de pago",L+16,y+18);col(GREY);font("normal",8.5);doc.text(`Transferencia bancaria antes del ${fdate(d.due)} a la cuenta:`,L+16,y+32);col(DARK);font("bold",10.5);doc.text(s.iban.replace(/(.{4})/g,"$1 ").trim(),L+16,y+46);y+=70;}
  if(s.footer){col(DARK);font("bold",10);doc.text(s.footer,L,Math.min(y+10,H-70));}
  const pages=doc.getNumberOfPages();for(let p=1;p<=pages;p++){doc.setPage(p);doc.setDrawColor(223,226,232);doc.line(L,H-44,R,H-44);col(GREY);font("normal",7.5);
    doc.text(`${s.name||""}${s.nif?" · NIF "+s.nif:""}${s.web?" · "+s.web:""}`,L,H-30);doc.text(`${d.number||""} · Pág. ${p} de ${pages}`,R,H-30,{align:"right"});}
  doc.setProperties({title:`${title} ${d.number||""}`,author:s.name||""});return doc;}

function csv(rows){return "﻿"+rows.map(r=>r.map(v=>{const s=typeof v==="number"?v.toFixed(2).replace(".",","):String(v??"");return /[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(";")).join("\r\n");}
async function exportZip(y,q,btn){const {inv,exp,I,E}=quarterData(y,q);const a=m303(y,q),b=m130(y,q),c=m111(y,q),e349=m349(y,q);btn.disabled=true;const old=btn.textContent;btn.textContent="Preparando…";
  try{const zip=new JSZip();const tag=`T${q}_${y}`;const fe=zip.folder("1_Facturas_emitidas"),fr=zip.folder("2_Facturas_recibidas");
   const allInv=S.invoices.filter(i=>inQ(i.date,y,q));for(const i of allInv)fe.file(`${i.number}_${safe(i.contact?.name)}.pdf`,buildPdf(i,"invoice").output("arraybuffer"));
   const miss=[];for(const x of exp){if(!x.assetId){miss.push(x);continue;}try{const bl=await FILES.blob(x.assetId);const ext=(x.assetName||"f.pdf").split(".").pop();fr.file(`${x.date}_${safe(x.supplier)}${x.number?"_"+safe(x.number):""}.${ext}`,await bl.arrayBuffer());}catch(_){miss.push(x);}}
   zip.file(`Libro_facturas_emitidas_${tag}.csv`,csv([["Número","Tipo","Fecha","Cliente","NIF cliente","Ubicación","Base imponible","IVA %","Cuota IVA","Retención IRPF","Total","Estado","Fecha cobro"],...allInv.map(i=>{const t=docTotals(i);return [i.number,i.kind||"factura",fdate(i.date),i.contact?.name,i.contact?.cif,REGION[i.contact?.region||"ES"],t.base,Object.keys(t.byRate).join("/"),t.iva,t.irpf,t.total,invStatus(i)[0],fdate(i.paidDate)];})]));
   zip.file(`Libro_facturas_recibidas_${tag}.csv`,csv([["Fecha","Proveedor","NIF proveedor","Nº factura","Concepto","Categoría","Ubicación","Base imponible","IVA %","Cuota IVA","Retención IRPF","Total","ISP","% deducible","PDF"],...exp.map(x=>[fdate(x.date),x.supplier,x.cif,x.number,x.concept,x.category,REGION[x.region||"ES"],+x.base||0,x.reverseCharge?"ISP":x.vat+"%",expVat(x),expIrpf(x),expTotal(x),x.reverseCharge?"Sí":"No",dedPct(x),x.assetId&&!miss.includes(x)?"Sí":"No"])]));
   const s=S.settings||{};zip.file(`Resumen_${tag}.txt`,[`${s.name||""} · NIF ${s.nif||""}`,`Resumen del ${q}º trimestre de ${y}`,"",
    `FACTURAS EMITIDAS: ${inv.length}`,`  Base imponible: ${eurP(I.base)}`,`  IVA repercutido: ${eurP(I.iva)}`,`  Retenciones IRPF soportadas: ${eurP(I.irpf)}`,"",
    `FACTURAS RECIBIDAS: ${exp.length}`,`  Base imponible: ${eurP(E.base)}`,`  IVA soportado deducible: ${eurP(E.iva)}`,"",
    `MODELO 303 (estimado): devengado ${eurP(a.devTotal)} · deducible ${eurP(a.dedTotal)} · resultado ${eurP(a.result)}`,a.ue.base?`  Adquisiciones intracomunitarias de servicios (ISP): base ${eurP(a.ue.base)}`:null,a.ext.base?`  Otras operaciones con ISP: base ${eurP(a.ext.base)}`:null,
    `MODELO 130 (estimado): rendimiento acumulado ${eurP(b.rend)} · 20 % ${eurP(b.c04)} · pagos anteriores ${eurP(b.pagos)} · retenciones ${eurP(b.ret)} · resultado ${eurP(b.result)}`,
    c.ret?`MODELO 111: retenciones practicadas ${eurP(c.ret)}`:null,e349.length?`MODELO 349: ${e349.map(r=>`${r.clave} ${r.name} ${r.nif||""} ${eurP(r.base)}`).join("; ")}`:null,"",
    miss.length?`FALTAN ${miss.length} FACTURAS DE GASTO EN PDF:\n`+miss.map(x=>`  - ${fdate(x.date)} ${x.supplier} ${eurP(expTotal(x))}`).join("\n"):"Todas las facturas de gasto están adjuntas."].filter(v=>v!==null).join("\n"));
   download(`${safe(s.brandName||"autonomo")}_${tag}_para_gestor.zip`,await zip.generateAsync({type:"blob"}));if(miss.length)toast(`ZIP listo. Faltan ${miss.length} PDF de gastos (van listados en el resumen).`);}
  catch(err){console.error(err);toast("No se pudo preparar el ZIP.");}finally{btn.disabled=false;btn.textContent=old;}}
